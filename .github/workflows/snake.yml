name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Light: Expo indigo snake over a React-blue scale. Dark: React cyan.
          outputs: |
            dist/github-snake.svg?color_snake=#4630eb&color_dots=#ebedf0,#c6e8f0,#58c4dc,#087ea4,#4630eb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58c4dc

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
